[package]
name = "luman"
version = "0.1.0"
description = "Luman — macOS storage intelligence"
authors = ["Pivot Technologies"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "luman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Bundle a webview into the final binary on Windows.
custom-protocol = ["tauri/custom-protocol"]
